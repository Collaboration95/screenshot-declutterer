[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenshot-declutterer"

version = "0.5.0"

description = "A simple macOS tool to quickly sort and trash Desktop screenshots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
    "send2trash>=1.8",
]

[dependency-groups]
dev = [
    "pip-audit>=0.5",
    "pre-commit>=4.0",
    "pytest-cov>=5.0",
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/ss_dcl"]
force-include = { templates = "templates", static = "static" }
