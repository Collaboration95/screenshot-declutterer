<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Declutterer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Screenshot Declutterer</h1>
    <div class="header-right">
      <span id="status-msg" role="status" aria-live="polite"></span>
      <label for="sort-select" class="sr-only">Sort order</label>
      <select id="sort-select" aria-label="Sort screenshots">
        <option value="date_desc">Newest first</option>
        <option value="date">Oldest first</option>
        <option value="name">Name (A–Z)</option>
        <option value="name_desc">Name (Z–A)</option>
        <option value="size">Smallest first</option>
        <option value="size_desc">Largest first</option>
      </select>
      <button id="undo-btn" disabled aria-label="Undo last move">Undo</button>
      <button id="done-btn" disabled aria-label="Move screenshots to trash">Done</button>
    </div>
  </header>

  <main class="kanban" role="region" aria-label="Screenshot sorting board">
    <!-- Keep column (left) -->
    <section class="column column-keep" id="col-keep" data-column="keep" role="list" aria-label="Keep column">
      <div class="column-header">
        <span class="column-title">Keep</span>
        <span class="column-count" id="count-keep">0</span>
      </div>
      <div class="column-cards" id="cards-keep"></div>
    </section>

    <!-- Unsorted column (center) -->
    <section class="column column-unsorted" id="col-unsorted" data-column="unsorted" role="list" aria-label="Unsorted column">
      <div class="column-header">
        <span class="column-title">Unsorted</span>
        <span class="column-count" id="count-unsorted">0</span>
      </div>
      <div class="column-cards" id="cards-unsorted"></div>
      <p id="loading-msg">Loading screenshots…</p>
      <p id="empty-msg" hidden>No screenshots found on your Desktop.</p>
    </section>

    <!-- Trash column (right) -->
    <section class="column column-trash" id="col-trash" data-column="trash" role="list" aria-label="Trash column">
      <div class="column-header">
        <span class="column-title">Trash</span>
        <span class="column-count" id="count-trash">0</span>
      </div>
      <div class="column-cards" id="cards-trash"></div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-label="Image preview">
    <div class="lightbox-backdrop"></div>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" decoding="async" />
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  </div>

  <!-- Confirm modal -->
  <div id="confirm-modal" class="modal-overlay" hidden role="dialog" aria-labelledby="modal-title">
    <div class="modal">
      <p class="modal-title" id="modal-title">Move screenshots to Trash?</p>
      <p class="modal-desc">This uses macOS Trash — you can recover files if needed.</p>
      <div class="modal-actions">
        <button class="modal-btn modal-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-btn modal-confirm" id="modal-confirm">Move to Trash</button>
      </div>
    </div>
  </div>

  <!-- Rename modal -->
  <div id="rename-modal" class="modal-overlay" hidden role="dialog" aria-labelledby="rename-title">
    <div class="modal">
      <p class="modal-title" id="rename-title">Rename Screenshot</p>
      <p class="modal-desc">Enter a new filename (extension will be preserved if unchanged).</p>
      <input id="rename-input" type="text" class="rename-input" autocomplete="off" spellcheck="false" />
      <p id="rename-error" class="rename-error"></p>
      <div class="modal-actions">
        <button class="modal-btn modal-cancel" id="rename-cancel">Cancel</button>
        <button class="modal-btn modal-confirm rename-confirm-btn" id="rename-confirm">Rename</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
